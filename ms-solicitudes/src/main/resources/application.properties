spring.application.name=ms-solicitudes

# Puerto propio para este microservicio (EC2 B)
server.port=${SERVER_PORT:8081}

# ===== RDS Solicitudes (instancia EXCLUSIVA, distinta de la de Catalogo) =====
# Valores reales en variables de entorno (archivo .env en la EC2 B, nunca en Git)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mesatechcloud_solicitudes}
spring.datasource.username=${DB_USER:mesatech_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== RabbitMQ (EC2 C, por IP PRIVADA) =====
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.virtual-host=${RABBIT_VHOST:mesatech}
spring.rabbitmq.connection-timeout=5s

# Un mensaje a la vez; ACK automatico SOLO cuando el listener termina bien (despues de guardar en RDS)
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
# Si falla el guardado (ej: RDS caida) el mensaje vuelve a la cola
spring.rabbitmq.listener.simple.default-requeue-rejected=true
# Si la cola no existe al arrancar, falla el inicio en vez de quedar "levantado" sin consumir
spring.rabbitmq.listener.simple.missing-queues-fatal=true

app.rabbitmq.queue=${RABBIT_QUEUE:solicitudes.catalogo.queue}
