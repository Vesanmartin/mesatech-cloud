spring.application.name=ms-solicitudes

# Conexion a MySQL (configurable por variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mesatechcloud_solicitudes}
spring.datasource.username=${DB_USER:mesatech_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Puerto propio para este microservicio
server.port=8081