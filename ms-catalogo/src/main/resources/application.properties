spring.application.name=ms-catalogo

# Puerto propio para este microservicio (EC2 A)
server.port=${SERVER_PORT:8082}

# ===== RDS Catalogo (instancia EXCLUSIVA de este microservicio) =====
# Valores reales en variables de entorno (archivo .env en la EC2 A, nunca en Git)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mesatechcloud_catalogo}
spring.datasource.username=${DB_USER:mesatech_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== RabbitMQ (EC2 C, por IP PRIVADA: no cambia al reiniciar el Learner Lab) =====
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.virtual-host=${RABBIT_VHOST:mesatech}
spring.rabbitmq.connection-timeout=5s

# Confirmaciones del broker + retorno de mensajes que no llegan a ninguna cola
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

app.rabbitmq.exchange=${RABBIT_EXCHANGE:catalogo.exchange}
app.rabbitmq.routing-key=${RABBIT_ROUTING_KEY:categoria.creada}
