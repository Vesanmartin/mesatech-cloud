spring.application.name=bff

server.port=${SERVER_PORT:8080}

# Validacion de JWT emitido por Microsoft Entra ID (Tenant Vero)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/36218c1c-0f05-4845-9f7e-b6f4f6a9ccde/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=9fd2e6cb-ff60-4e0c-b508-e37a86ac6d4f

# URLs internas de los microservicios (el BFF les reenvia las peticiones)
# EP2: cada microservicio esta en una EC2 distinta -> usar su IP PRIVADA mediante variables de entorno
ms.solicitudes.url=${MS_SOLICITUDES_URL:http://172.31.29.191:8081}
ms.catalogo.url=${MS_CATALOGO_URL:http://localhost:8082}

# Origenes permitidos por CORS (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# RabbitMQ Management API en EC2 C (Monitoreo real de la cola)
app.rabbitmq.management.url=${RABBITMQ_MANAGEMENT_URL:http://172.31.17.146:15672}
app.rabbitmq.management.user=${RABBITMQ_MANAGEMENT_USER:admin}
app.rabbitmq.management.password=${RABBITMQ_MANAGEMENT_PASSWORD:RabbitMQ2026!}
app.rabbitmq.virtual-host=${RABBIT_VHOST:mesatech}
app.rabbitmq.queue=${RABBIT_QUEUE:solicitudes.catalogo.queue}
